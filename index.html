<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Dashboard</title>
</head>
<body>
    <section class="header">
        <div class="top">
            <div class="left-side">
                <div class="search">
                    <!-- Add m-glass icon here --> 
                    <input class="grey" id="search" type="search" name="search" />
                </div>    
            </div>
            
            <div class="right-side">
                <!-- Add notification icon here -->
                <!-- Add sample profile image -->
                <span class="profile-name medium">Morgan Oakley</span>
            </div>
        </div>

        <div class="bottom">
            <div class="left-side">
                <!-- Add sample profile image here -->
                <div class="welcome-msg">
                    <div class="greeting">Hi there,</div>
                    <div class="profile-name large">Morgan Oakley</div>
                </div>
            </div>

            <div class="right-side">
                <button class="btn blue">New</button>
                <button class="btn blue">Upload</button>
                <button class="btn blue">Share</button>
            </div>

        </div>
    </section>

    <section class="sidebar blue">

        <div class="dashboard-icon">
            <span class="dashboard-icon-text">Dashboard</span>
        </div>

        <div class="options">
            <ul class="first-links">
                <li class="nav-link"><a href="#">home</a></li>
                <li class="nav-link"><a href="#">profile</a></li>
                <li class="nav-link"><a href="#">messages</a></li>
                <li class="nav-link"><a href="#">history</a></li>
                <li class="nav-link"><a href="#">tasks</a></li>
                <li class="nav-link"><a href="#">communities</a></li>
            </ul>
        </div>

        <div class="additional-options">
            <ul class="second-links">
                <li class="nav-link"><a href="#">settings</a></li>
                <li class="nav-link"><a href="#">support</a></li>
                <li class="nav-link"><a href="#">privacy</a></li>
            </ul>
        </div>
    </section>

    <section class="main-content grey">
        
    </section>
</body>
</html>
