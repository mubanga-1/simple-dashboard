<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Dashboard</title>
</head>
<body>
    <section class="header">
        <div class="top">
            <div class="left-side">
                <div class="search">
                    <img src="svgs/search.svg" >
                    <div class="input-wrapper">  
                        <input class="grey" id="search" type="search" name="search" />
                    </div>
                </div>    
            </div>
            
            <div class="right-side">
                <div class="notifications">
                    <img src="svgs/bell-outline.svg">
                </div>
                <div class="profile-img-wrapper small">
                    <img src="profile-img.jpg">
                </div>
                <span class="profile-name medium">Morgan Oakley</span>
            </div>
        </div>

        <div class="bottom">
            <div class="left-side">
                <div class="profile-img-wrapper large">
                    <img src="profile-img.jpg">
                </div>
                <div class="welcome-msg">
                    <div class="greeting">Hi there,</div>
                    <div class="profile-name large">Morgan Oakley (@morgan)</div>
                </div>
            </div>

            <div class="right-side">
                <div class="btn-wrapper">
                    <button class="btn blue">New</button>
                </div>
                <div class="btn-wrapper">
                    <button class="btn blue">Upload</button>
                </div>
                <div class="btn-wrapper">
                    <button class="btn blue">Share</button>
                </div>
            </div>

        </div>
    </section>

    <section class="sidebar blue">

        <div class="dashboard-icon">
            <div class="icon-img">
                <img src="svgs/dashboard.svg" />
            </div>
            <span class="dashboard-icon-text">Dashboard</span>
        </div>

        <div class="options">
            <ul class="first-links">
                <li class="nav-link">
                    <a href="#"><img src="svgs/home.svg"><div>home</div></a>
                </li>
                <li class="nav-link">
                    <a href="#"><img src="svgs/profile.svg"><div>profile</div></a>
                </li>
                <li class="nav-link">
                    <a href="#"><img src="svgs/messages.svg"><div>messages</div></a>
                </li>
                <li class="nav-link">
                    <a href="#"><img src="svgs/history.svg"><div>history</div></a>
                </li>
                <li class="nav-link">
                    <a href="#"><img src="svgs/tasks.svg"><div>tasks</div></a>
                </li>
                <li class="nav-link">
                    <a href="#"><img src="svgs/communities.svg"><div>communities</div></a>
                </li>
            </ul>
        </div>

        <div class="additional-options">
            <ul class="second-links">
                <li class="nav-link">
                    <a href="#"><img src="svgs/settings.svg"><div>settings</div></a>
                </li>
                <li class="nav-link">
                    <a href="#"><img src="svgs/support.svg"><div>support</div></a></li>
                <li class="nav-link">
                    <a href="#"><img src="svgs/privacy.svg"><div>privacy</div></a>
                </li>
            </ul>
        </div>
    </section>

    <section class="main-content grey">
        
    </section>
</body>
</html>
